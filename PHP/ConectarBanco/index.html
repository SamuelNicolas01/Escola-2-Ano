<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepção</title>
</head>

<body>
    <form action="index.php" method="post">
        <label for="fnome">Nome:</label></br>
            <input type="text" required placeholder="Digite seu Nome" name="fnome" id="fnome"></br></br>

        <label for="fend">Endereço:</label></br>
            <input type="text" required placeholder="Digite seu endereço" id="fend" name="fend"></br></br>

        <label for="ftel">Telefone:</label></br>
            <input type="text" name="ftel" id="ftel" required></br></br>

        <label for="frg">RG:</label></br>
            <input type="text" id="frg" name="frg" required></br></br>

        <label for="fcpf">CPF:</label></br>
            <input type="text" required id="fcpf" name="fcpf"></br></br>
        <span id="erro-cpf" style="display:none;color:red;">
            CPF inválido
        </span></br>    

        <label for="fdt_nasc">Data de Nascimento:</label></br>
            <input type="date" required id="fdt_nasc" name="fdt_nasc"></br></br>

        <label for="fdt_hr_visita">Data da visita e hora:</label></br>
    <input type="datetime-local" required name="fdt_hr_visita" id="fdt_hr_visita"></br></br>

        <button type="submit">Enviar</button>
    </form>

  <script>
 
        function mascaraCPF(input) {
            let cpf = input.value.replace(/\D/g, "");
 
            cpf = cpf.substring(0, 11);
 
            cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
            cpf = cpf.replace(/(\d{3})\.(\d{3})(\d)/, "$1.$2.$3");
            cpf = cpf.replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, "$1.$2.$3-$4");
 
            input.value = cpf;
        }
 
        // Conecta a função mascaraCPF ao campo de CPF (isso faltava antes)
        const cpfInput = document.getElementById("fcpf");
 
        cpfInput.addEventListener("input", function () {
            mascaraCPF(this);
        });
 
        // Verifica se os dígitos verificadores do CPF batem com o cálculo oficial
        function validarCPF(cpf) {
            cpf = cpf.replace(/\D/g, "");
 
            if (cpf.length !== 11) return false;
 
            // Rejeita sequências repetidas (111.111.111-11, etc), que passam no cálculo mas não são válidas
            if (/^(\d)\1{10}$/.test(cpf)) return false;
 
            // Calcula o 1º dígito verificador (posição 10)
            let soma = 0;
            for (let i = 0; i < 9; i++) {
                soma += parseInt(cpf.charAt(i)) * (10 - i);
            }
            let resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpf.charAt(9))) return false;
 
            // Calcula o 2º dígito verificador (posição 11)
            soma = 0;
            for (let i = 0; i < 10; i++) {
                soma += parseInt(cpf.charAt(i)) * (11 - i);
            }
            resto = (soma * 10) % 11;
            if (resto === 10 || resto === 11) resto = 0;
            if (resto !== parseInt(cpf.charAt(10))) return false;
 
            return true;
        }
 
        // Bloqueia o envio do formulário se o CPF for inválido
        document.querySelector("form").addEventListener("submit", function (evento) {
            if (!validarCPF(cpfInput.value)) {
                evento.preventDefault();
                document.getElementById("erro-cpf").style.display = "inline";
                cpfInput.classList.add("campo-invalido");
                cpfInput.scrollIntoView({ behavior: "smooth" });
            }
        });
 
        const params = new URLSearchParams(window.location.search);
 
        if (params.get('erro') === 'cpf_invalido') {
            //mensagem de erro
            document.getElementById('erro-cpf').style.display = 'inline';
            document.getElementById('fcpf').classList.add('campo-invalido');
 
            const cpfErrado = params.get('cpf');
            if (cpfErrado) {
                document.getElementById('fcpf').value = cpfErrado;
            }
 
            document.getElementById('fcpf').scrollIntoView({behavior: 'smooth'});
 
            const urlLimpa = window.location.pathname;
            window.history.replaceState({}, '', urlLimpa);
 
            document.getElementById('fcpf').addEventListener('input', function () {
                this.classList.remove('campo-invalido');
                document.getElementById('erro-cpf').style.display = 'none';
            });
        }
 
        const telefone = document.getElementById("ftel");
 
        telefone.addEventListener("input", function () {
            let tvalor = this.value.replace(/\D/g, "");
 
            tvalor = tvalor.replace(/^(\d{2})(\d)/g, "($1) $2");
            tvalor = tvalor.replace(/(\d)(\d{4})$/, "$1-$2");
 
            this.value = tvalor;
        });
    </script>
</body>

</html>
