<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cadastro de Pessoa</title>
</head>
<body>

	<h1>Cadastro de Pessoa</h1>
	<p>Campos marcados com * são obrigatórios</p>

	<form action="pessoa_2infoM.php" method="POST">

		<label for="fnome">Nome completo* </label><br>
		<input type="text" name="fnome" id="fnome" maxlength="80"
		required > <br><br>

		<label for="fend">Endereço* </label><br>
		<input type="text" name="fend" id="fend" maxlength="120"
		required><br><br>

		<label for="ftel">Telefone* </label><br>
		<input type="text" name="ftel" id="ftel" maxlength="11" placeholder="11999998888" required><br><br>

		<label for="frg">RG* </label><br>
		<input type="text" name="frg" id="frg" maxlength="9" placeholder="123456789" required><br><br>

		<label for="fcpf">CPF* </label><br>
		<input type="text" name="fcpf" id="fcpf" maxlength="11" 
		placeholder="12345678910" required><br><br>

		<label for="fdt_nasc">Data de Nascimento* </label><br>
		<input type="date" name="fdt_nasc" id="fdt_nasc" required> <br><br>

		<input type="submit" value="Enviar Cadastro"><br>


		

	</form>

</body>
</html>
