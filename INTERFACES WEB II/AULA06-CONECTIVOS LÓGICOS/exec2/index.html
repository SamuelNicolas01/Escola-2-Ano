<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EXERCICIO 2</title>
</head>
<body>
	<h1>RADAR RODOVIARIO</h1>
	<p>SUA VELOCIDADE ATUAL É DE</p>
	<input type="number" id="n1" placeholder="velocidade do seu carro">
	<button onclick="velocidade()">CÁLCULO</button>


	<p id="mostrar"></p>
	

	<script>
		function velocidade(){
			let velo = Number(document.getElementById("n1").value);

			if(( velo >= 80 )||( velo <= 40)){
				document.getElementById("mostrar").textContent = velo + "km/h MULTA";
			}
			 else {
				document.getElementById("mostrar").textContent = velo + "km/h SEM MULTA, ta suave pae!";
			}
		}
	</script>
	
</body>
</html>
