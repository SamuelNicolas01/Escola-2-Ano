<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EXERCICIO 3</title>
</head>
<body>
	<input type="number" id="n1" placeholder="digite sua idade pae!"><br><br>
	<input type="number" id="n2" placeholder="digie seu salário pae!"><br><br>

	<button onclick="calculo()">VAMO VER SE DÁ PAE!</button>

	<p id="resultado"></p>

	<script>
		function calculo(){
			const idade = Number(document.getElementById("n1").value);
			const salario = Number(document.getElementById("n2").value);

			if (idade >= 18 && salario >= 2000) {
				document.getElementById("resultado").textContent = "PODE COMPRAR PAE";
			} else {
				document.getElementById("resultado").textContent = "DA NÃO PAE!";
			}
		}
	</script>
</body>
</html>
