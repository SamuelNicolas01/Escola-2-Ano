<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FUNÇÕES</title>
</head>
<body>
	<p id="mensagem">Aqui vai aparecer a mensagem</p>

	<!--O ONCLICK COM MUITOS COMANDOS TORNA O CÓDIGO CONFUSO-->
	<!--O IDEAL É SEPARAR O JAVASCRIPT E CRIAR UMA FUNÇÃO-->
	<button onclick="mostrarMensagem()">
		Clique aqui</button>

	<script type="text/javascript">
		function mostrarMensagem(){
			document.getElementById('mensagem').innerHTML='bom dia';
			alert('Tudo bem?');
			alert('E a família');
		}
	</script>
</body>
</html>
