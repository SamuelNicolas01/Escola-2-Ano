<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo do Gênio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-image: url('IMAGENS/fundo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #fff;
            text-shadow: 1px 1px 3px #000;
        }

        img {
            width: 300px;
            height: 300px;
            object-fit: contain;
            margin: 20px;
        }

        input {
            width: 100px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        #mensagem {
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
            color: red;
        }

        #teste{
            /*margin-left: 380px;
            color: red;
            width: 40%;
            height: 350px;
            align-items: center;*/
        }


        #logo{
            height: 200px;
            width: 300px;
        }

        #pensando {
            background-color: yellow;
            color: red;
            width: 25%;
            height: 30px;
            display: flex;
            flex-direction: row;
            align-items: center;     
            justify-content: center; 
            border: 2px solid red;
            font-weight: bold;
            margin: 0 auto;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <img src="IMAGENS/File_Teen_Titans_show_logo_svg-removebg-preview.png" id="logo">
    <h1>Jogo do Gênio Robin</h1>
    <div id="teste">
        <center><img id="imagemGenio" src="IMAGENS/advinhe.jpg" alt="Gênio"></center>
    </div>

    <br>

    <input type="number" id="palpite" min="1" max="10" placeholder="1-10">

    <button onclick="jogar()">
        Tentar
    </button>

    <div id="pensando">
    <p id="mensagem">
        Estou pensando em um número de 1 a 10
    </p>
    </div>

    <script>

        // Função
        let numeroSecreto = Math.floor(Math.random() * 10) + 1;

        console.log(numeroSecreto);

        function jogar() {

            const input = document.getElementById("palpite");
            const mensagem = document.getElementById("mensagem");
            const imagem = document.getElementById("imagemGenio");

            let tentativa = Number(input.value);

            if (tentativa < 1 || tentativa > 10 || isNaN(tentativa)) {

                mensagem.innerHTML = "Digite um número entre 1 e 10!";
                return;
            }
            // se ganhar
            if (tentativa === numeroSecreto) {

                mensagem.innerHTML = "Parabéns! Você acertou!";

                // Imagem de vitória
                imagem.src = "IMAGENS/acertou.jpg";

                // Desativa botão
                input.disabled = true;

                document.querySelector("button").disabled = true;

            }

            else {

                // Troca a imagem para a de erro
                imagem.src = "IMAGENS/errado.jpg";

                if (tentativa < numeroSecreto) {

                    mensagem.innerHTML =
                        "Errou! O número secreto é MAIOR.";

                }

                else {

                    mensagem.innerHTML =
                        "Errou! O número secreto é MENOR.";

                }

            }

            input.value = "";
            input.focus();

        }

    </script>

</body>
</html>
