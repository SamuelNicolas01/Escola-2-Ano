<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PORTA CADEADO</title>
</head>
<body>

	<h2>Exemplo 2 - Trocar Images</h2>

	<!-- BOTÃO DA ESQUERDA -->
	 <button onclick="document.getElementById('imagemPorta').src='imagem/portaAberta.png'">
		Abrir porta<br/>
		<img src="imagem/cadeadoAberto.png" style="width: 50px;"/>
	 </button>

	 <!--IMAGEM DA PORTA -->
	 <img src="imagem/portaFechada.png" id="imagemPorta" style="width: 300px;"/>

	 <!--IMAGEM DO CADEADO FECHADO-->
	 <button onclick="document.getElementById('imagemPorta').src='imagem/portaFechada.png'">
		fechar a porta<br/>
		<img src="imagem/cadeadoFechado.png" style="width: 50px;"/>
	 </button>
</body>
</html>
