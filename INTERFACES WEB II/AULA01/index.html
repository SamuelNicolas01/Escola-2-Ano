<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EXEMPLO 1</title>
</head>
<body>
    <h2>Exemplo 1 - Data e hora</h2>

    <button style="background-color: purple; color: yellow;" type="button" onclick="document.getElementById('conteudo'). 
        innerHTML = Date()">
    
    Clique aqui para ver a data e hora</button>

    <button type="button" onclick="document.getElementById('meuNome').innerHTML = 'Little Rafa' "> Mostrar o meu nome </button>

    <!--Semântica-->
    <p id="conteudo">A data e hora serão mostrados </p>

    <p id="meuNome">Meu nome aparece aqui</p>
</body>
</html>
