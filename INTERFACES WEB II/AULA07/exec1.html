<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercicio 1</title>
</head>

<body>
    <script>
        let num = 1000;
        while (num <= 10000) {
            num += 1;
            if (num % 5 === 0) {
                console.log("Múltiplo de 5 = " + num);
            } else if (num % 9 === 0) {
                console.log("Múltiplo de 9 = " + num);
            }
        }
    </script>
</body>

</html>
