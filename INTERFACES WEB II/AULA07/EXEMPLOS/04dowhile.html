<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Do While Exemplo02</title>
</head>
<body>
	<script type="text/javascript">
		let aumento = 500; 
		do { 
		  console.log("O salário ainda é R$" + aumento); 
		  aumento += 50; 
		} while (aumento < 500) 
	</script>
</body>
</html>
