<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>While Exemplo02</title>
</head>
<body>
	<script type="text/javascript">
		let salario = 1000 
		while (salario < 5000) { 
		  salario += 100; 
		  console.log("O salário ainda é R$" + salario); 
		}
	</script>
</body>
</html>
